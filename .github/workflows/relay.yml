name: relay-cron
# 슬림 버전 v2 (2026-09-29)
#   · 실제 발송은 Cloudflare Worker 내부 cron 이 담당
#   · 이 워크플로는 발송 큐 강제 flush + 7일 요약 조회만 수행
#   · npm/외부 CLI 의존 제거 → npm ci 실패 원천 차단
#   · 필요한 Secrets:
#       WORKER_BASE   (예: https://hecto-torres-worker.hectoai240.workers.dev)
#       RELAY_TOKEN   (Worker 시크릿과 동일)

on:
  schedule:
    - cron: '*/5 * * * *'    # 5분마다
  workflow_dispatch:          # 수동 실행 버튼

concurrency:
  group: relay-cron
  cancel-in-progress: false

jobs:
  # ── 1) send_queue 강제 flush (워커 내부 cron 을 5분 주기로 앞당김)
  flush_send_queue:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: send_queue flush 호출
        run: |
          set -e
          RESP=$(curl -sS -X POST \
            "${{ secrets.WORKER_BASE }}/api/queue/flush" \
            -H "Content-Type: application/json" \
            -H "X-Relay-Token: ${{ secrets.RELAY_TOKEN }}" \
            -d '{"limit":50}')
          echo "$RESP"
          echo "$RESP" | jq -r '"processed=\(.processed // 0) sent=\(.sent // 0) failed=\(.failed // 0)"' || true

  # ── 2) 발송 요약 조회 (7일)
  summary:
    runs-on: ubuntu-latest
    needs: flush_send_queue
    timeout-minutes: 2
    steps:
      - name: 발송 요약 조회
        run: |
          set -e
          RESP=$(curl -sS "${{ secrets.WORKER_BASE }}/api/send/summary")
          echo "$RESP"
