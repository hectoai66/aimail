name: relay-cron
# v3 (2026-09-29) · 순수 curl + Node inline nodemailer
#   · package.json 불필요 → npm ci 실패 원천 차단
#   · 워커 pop 응답에 SMTP 자격증명 포함 → 시크릿 참조 최소화
#   · 필요한 Secrets:
#       WORKER_BASE   (예: https://hecto-torres-worker.hectoai240.workers.dev)
#       RELAY_TOKEN   (Worker 시크릿과 동일)

on:
  schedule:
    - cron: '*/5 * * * *'    # 5분마다
  workflow_dispatch:          # 수동 실행 버튼

concurrency:
  group: relay-cron
  cancel-in-progress: false

jobs:
  # ── 1) send_queue 강제 flush (워커 내부 cron 을 5분 주기로 앞당김)
  flush_send_queue:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: send_queue flush 호출
        run: |
          set -e
          RESP=$(curl -sS -X POST \
            "${{ secrets.WORKER_BASE }}/api/queue/flush" \
            -H "Content-Type: application/json" \
            -H "X-Relay-Token: ${{ secrets.RELAY_TOKEN }}" \
            -d '{"limit":50}')
          echo "$RESP"

  # ── 2) SMTP 실전송 (pop → nodemailer 전송 → done)
  smtp_send:
    runs-on: ubuntu-latest
    needs: flush_send_queue
    timeout-minutes: 5
    steps:
      - name: 큐 pop
        id: pop
        run: |
          set -e
          POP=$(curl -sS -X POST \
            "${{ secrets.WORKER_BASE }}/api/queue/pop" \
            -H "Content-Type: application/json" \
            -H "X-Relay-Token: ${{ secrets.RELAY_TOKEN }}" \
            -d '{"limit":20}')
          echo "$POP" > /tmp/pop.json
          COUNT=$(echo "$POP" | python3 -c "import sys,json;print(len(json.load(sys.stdin).get('jobs',[])))")
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "pop 결과: $COUNT 건"

      - name: 종료 (큐 비어있음)
        if: steps.pop.outputs.count == '0'
        run: echo "발송할 잡 없음 · 정상 종료"

      - name: nodemailer 설치
        if: steps.pop.outputs.count != '0'
        run: |
          npm install --silent --no-package-lock --no-save nodemailer@6.9.14

      - name: SMTP 발송 + 결과 보고
        if: steps.pop.outputs.count != '0'
        env:
          WORKER_BASE: ${{ secrets.WORKER_BASE }}
          RELAY_TOKEN: ${{ secrets.RELAY_TOKEN }}
        run: |
          node <<'JS'
          const fs = require('fs');
          const https = require('https');
          const nodemailer = require('nodemailer');
          const pop = JSON.parse(fs.readFileSync('/tmp/pop.json', 'utf8'));
          const { jobs, sender, smtp } = pop;

          const transporter = nodemailer.createTransport({
            host: smtp.host,
            port: smtp.port,
            secure: smtp.secure,
            auth: { user: smtp.user, pass: smtp.pass }
          });

          const results = [];
          (async () => {
            for (const j of jobs) {
              try {
                const info = await transporter.sendMail({
                  from: `"${sender.name}" <${sender.email}>`,
                  replyTo: sender.reply_to || sender.email,
                  to: j.to_name ? `"${j.to_name}" <${j.to_email}>` : j.to_email,
                  subject: j.subject,
                  html: j.html
                });
                console.log(`OK id=${j.id} to=${j.to_email} messageId=${info.messageId}`);
                results.push({ id: j.id, status: 'sent' });
              } catch (e) {
                console.error(`FAIL id=${j.id} to=${j.to_email}:`, e.message);
                results.push({ id: j.id, status: 'failed', error: String(e.message).slice(0, 500) });
              }
            }

            // done 보고
            const body = JSON.stringify({ jobs: results });
            const url = new URL('/api/queue/done', process.env.WORKER_BASE);
            const req = https.request({
              method: 'POST',
              hostname: url.hostname,
              path: url.pathname,
              headers: {
                'Content-Type': 'application/json',
                'X-Relay-Token': process.env.RELAY_TOKEN,
                'Content-Length': Buffer.byteLength(body)
              }
            }, res => {
              let d = '';
              res.on('data', c => d += c);
              res.on('end', () => {
                console.log(`done HTTP=${res.statusCode} body=${d}`);
                if (results.some(r => r.status === 'failed')) process.exit(1);
              });
            });
            req.on('error', e => { console.error('done error', e); process.exit(1); });
            req.write(body);
            req.end();
          })();
          JS

  # ── 3) 상태 조회
  summary:
    runs-on: ubuntu-latest
    needs: smtp_send
    timeout-minutes: 2
    steps:
      - name: 큐 상태 조회
        run: |
          curl -sS "${{ secrets.WORKER_BASE }}/api/queue/status"
